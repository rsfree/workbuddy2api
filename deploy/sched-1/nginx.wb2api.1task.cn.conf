# ==========================================================================
# wb2api.1task.cn —— 旧域名，2026-10-23 起**别名**到同一个后端
# --------------------------------------------------------------------------
# 背景：两个域名原本各跑一套实例（wb2api → stage-1 hk，workbuddy2api → sched-1）。
# 现合并为单实例：两个域名同证书体系、同一 upstream 127.0.0.1:39017，
# 旧实例（154.21.201.183）容器下线。保留旧域名是为了线上转发/客户端零改动
# （api_key 也已继承旧值 sk-ba3949e4...）。
# --------------------------------------------------------------------------
# 🔴 与主域名 vhost 保持完全一致：SSE 必须 proxy_buffering off，否则流式变卡住。
# 🔴 证书独立签发（acme.sh dns_ali，DNS-01），避免与主域名共用一张证书后
#    任一方续期失败互相拖累。
# ==========================================================================

server {
    listen 80;
    server_name wb2api.1task.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name wb2api.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/wb2api.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wb2api.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:WB2API_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /www/wwwlogs/wb2api.1task.cn.log;
    error_log  /www/wwwlogs/wb2api.1task.cn.error.log;

    client_max_body_size 512m;
    client_body_timeout  300s;

    location ^~ / {
        # 宝塔全局 proxy.conf 在 http 块启用了 proxy_cache(cache_one)，
        # 动态接口被缓存会串会话 / 显示陈旧数据
        proxy_cache off;

        proxy_pass http://127.0.0.1:39017;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        # SSE：不缓冲、不限读超时、body 边收边转
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }
}

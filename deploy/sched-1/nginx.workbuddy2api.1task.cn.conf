# ==========================================================================
# workbuddy2api.1task.cn —— WorkBuddy2API 网关（OpenAI 兼容 + Web 面板）
# --------------------------------------------------------------------------
# 部署机：154.40.45.18（sched-1，与 154.40.45.34 同机另一出口 IP）
# 上游：docker 容器 workbuddy2api，仅绑回环 127.0.0.1:39017
# 证书：Let's Encrypt（acme.sh / dns_ali 管理，DNS-01，续期自动 reload）
# --------------------------------------------------------------------------
# 🔴 该服务以 SSE 流式返回，全部 location 必须 proxy_buffering off ——
#    否则 nginx 会攒满缓冲才下发，流式变成"卡住半天然后一次性吐出"。
# 🔴 网关自身不设请求体上限（多图会话每轮重发 base64），nginx 侧给足，
#    别在这里制造上游没有的 413。
# ==========================================================================

server {
    listen 80;
    server_name workbuddy2api.1task.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name workbuddy2api.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/workbuddy2api.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/workbuddy2api.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:WB2API_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /www/wwwlogs/workbuddy2api.1task.cn.log;
    error_log  /www/wwwlogs/workbuddy2api.1task.cn.error.log;

    client_max_body_size 512m;
    client_body_timeout  300s;

    location ^~ / {
        # 宝塔全局 proxy.conf 在 http 块启用了 proxy_cache(cache_one)，
        # 动态接口被缓存会串会话 / 显示陈旧数据
        proxy_cache off;

        proxy_pass http://127.0.0.1:39017;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        # SSE：不缓冲、不限读超时、body 边收边转
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }
}

services:
  wb2api:
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    # 🔴 必须用 host 网络：egress.mode=local 靠「按 uid 哈希绑定本机公网 IP」做出口隔离，
    # bridge 模式下容器只看得见自己的 172.30.x（日志 `local[1 ip]`），71 个号会全部挤在
    # 同一个默认出口（实测 154.40.45.34）—— 等于出口隔离完全失效。
    # host 模式下容器能枚举 wan 上全部 32 个公网地址，hash 才真正散开。
    network_mode: host
    # 镜像内置 HEALTHCHECK 打的是 /healthz —— 无账号时它**故意** 503，docker ps 会长期 unhealthy，不代表进程挂了。
    # 存活探针改用恒 200 的面板页（与 ai-prod 部署红线一致）。host 网络下端口由 config.json 的 listen 决定。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:39017/panel/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 容器默认以 app 用户（uid 10001）运行。宿主机挂载目录属主不同会导致
    # 「写入 auths/*.json.tmp 失败 permission denied」，三种解法任选：
    #   1) 非 root · 让容器以你自己的 uid 运行（挂载目录本来就是你建的）：
    #      PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #      或写进 .env 文件：PUID=1000 / PGID=1000
    #   2) sudo chown -R 10001:10001 ./auths ./data ./config.json
    #   3) user: "0:0" 以 root 运行（省事但容器逃逸面更大，自担）
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      - TZ=Asia/Shanghai
    # 🔴 host 网络下不能再用 ports 映射；对外只经 nginx，程序监听 127.0.0.1:39017
    # （config.json 的 "listen": "127.0.0.1:39017"），nginx 的 proxy_pass 保持不变。
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # 注意：宿主机必须先有 config.json（cp config.example.json config.json）。
      # 缺失时 Docker 会把挂载点创建成目录 → 容器启动失败（程序会自动生成配置，
      # 但前提是它能以文件形式写入 —— 挂载目录会挡住这条路径）。
      # 不挂 :ro：面板「配置」页需要写回此文件（保存后热生效）。
      - ./config.json:/app/config.json

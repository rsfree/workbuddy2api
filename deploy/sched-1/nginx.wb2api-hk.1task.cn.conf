# ==========================================================================
# wb2api-hk.1task.cn —— 旧实例的「限流版」对话入口，2026-10-23 合并到 sched-1
# --------------------------------------------------------------------------
# 来历：stage-1(hk) 时期与 wb2api.1task.cn 共用同一个容器（回环 39018），
#       但多一层洪水闸门（600r/m + burst 120）且 body 限 4m，只收 JSON 对话体。
# 现状：旧机器下线 → 本文件在 sched-1 复刻同等语义，后端改为 127.0.0.1:39017。
#       调用方（new-api 渠道）零改动：域名不变、鉴权 key 已继承旧值。
# ==========================================================================

# ⚠️ 宝塔把 vhost 在 **http 块内** include ⇒ limit_req_zone 可写在 server 之外。
#    zone 名带站点前缀，防与其他 vhost 重名。
limit_req_zone $binary_remote_addr zone=wb2api_hk_api:10m rate=600r/m;

server {
    listen 80;
    server_name wb2api-hk.1task.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name wb2api-hk.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/wb2api-hk.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wb2api-hk.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:WB2API_HK_TLS:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/wb2api-hk.1task.cn.log;
    error_log  /www/wwwlogs/wb2api-hk.1task.cn.error.log;

    # 入口层**不做**认证 —— 鉴权交给服务侧 api_key（config.json）。
    auth_basic off;

    location / {
        # 洪水闸门（**不是鉴权**）：10r/s 持续 + 120 突发，与原 HK 实例同参数。
        limit_req zone=wb2api_hk_api burst=120 nodelay;
        limit_req_status 429;

        proxy_cache off;
        proxy_pass http://127.0.0.1:39017;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式：不缓冲、长超时
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        client_max_body_size    4m;      # 只收 JSON 对话体，与原实例一致
    }
}

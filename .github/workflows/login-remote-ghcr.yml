name: login-remote-ghcr

# 远程浏览器 sidecar 镜像（deploy/login-remote）。
# 与主镜像分开发布：
#   - 只在 deploy/login-remote/** 变化时构建，日常发版不受影响；
#   - 只构建 linux/amd64（线上 154.40.45.18 是 x86_64），不跑 QEMU；
#   - 不打 v* 版本 tag：sidecar 无业务语义，compose 固定 :latest 即可。
#     需要回滚时用 sha-xxxxxxx tag（每次构建都会产生）。
on:
  push:
    branches: [main]
    paths:
      - "deploy/login-remote/**"
      - ".github/workflows/login-remote-ghcr.yml"
  pull_request:
    paths:
      - "deploy/login-remote/**"
      - ".github/workflows/login-remote-ghcr.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # github.repository 自动小写化 → ghcr.io/rsfree/workbuddy2api-login-remote
  IMAGE_NAME: ${{ github.repository }}-login-remote

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/login-remote
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
